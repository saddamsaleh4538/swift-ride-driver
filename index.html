<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>تطبيق السائق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0} 
body{background:#090a0b;color:#f8f1df;font-family:Tajawal,sans-serif;overflow-x:hidden;}
.app{max-width:430px;min-height:100vh;margin:auto;display:flex;flex-direction:column;padding:20px;padding-bottom:80px;}
.card{background:linear-gradient(150deg,#23231f,#191a18 );border:1px solid #d1a85d24;border-radius:17px;padding:15px;margin-bottom:15px;}
.field{margin-bottom:12px;}
.field label{display:block;color:#a69b87;font-size:12px;margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%;background:#0e0f0e;color:#fff;border:1px solid #d1a85d28;border-radius:11px;padding:12px;outline:none;}
.btn{width:100%;border:0;border-radius:13px;padding:13px;font-weight:bold;color:#092516;background:linear-gradient(135deg,#8ff0b6,#2ecc71);margin-top:10px;cursor:pointer;}
.btn.secondary{background:#333;color:#fff;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#20221f;color:#fff;padding:10px 20px;border-radius:10px;display:none;z-index:9999;white-space:nowrap;}
.toast.show{display:block;}
.screen{display:none;}
.screen.active{display:block;}
.bottom-nav{display:flex;justify-content:space-around;background:#090a0b;padding:10px;position:fixed;bottom:0;width:100%;max-width:430px;left:50%;transform:translateX(-50%);border-top:1px solid #222;}
.bottom-nav button{background:none;border:none;color:#a69b87;font-family:inherit;font-weight:bold;font-size:12px;padding:10px;}
.bottom-nav button.active{color:#f4d996;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.stat{padding:12px;text-align:center;background:#ffffff06;border:1px solid #ffffff0c;border-radius:13px;}
.stat b{display:block;color:#f4d996;font-size:21px;}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="app">
    <!-- شاشة التحميل -->
    <div id="loading" class="screen active" style="text-align:center; padding-top:100px;">
        <h2 style="color:#f4d996;">⏳ جاري التجهيز...</h2>
    </div>

    <!-- شاشة التسجيل -->
    <div id="register" class="screen">
        <div style="text-align:center; margin-bottom:20px;">
            <h1 style="color:#f4d996;">🚕 التسجيل ككابتن</h1>
            <p style="color:#a69b87; font-size:14px;">أكمل بياناتك لتبدأ العمل معنا.</p>
        </div>
        <div class="card">
            <div class="field"><label>الاسم الثنائي (إجباري )</label><input id="reg-name" placeholder="محمد عبدالله"></div>
            <div class="field"><label>الجنس</label><select id="reg-gender"><option value="ذكر">ذكر</option><option value="أنثى">أنثى</option></select></div>
            <div class="field"><label>المدينة (إجباري)</label><select id="reg-city"><option value="الرياض">الرياض</option><option value="جدة">جدة</option><option value="مكة">مكة المكرمة</option><option value="الدمام">الدمام</option><option value="أخرى">أخرى...</option></select></div>
            <div class="field"><label>نوع المركبة</label><select id="reg-vehicle"><option value="سيارة صغيرة">🚗 سيارة صغيرة</option><option value="سيارة عائلية">🚙 سيارة عائلية</option><option value="دينة">🛻 دينة</option><option value="دباب">🏍️ دباب</option></select></div>
            <div class="field"><label>موديل السيارة (إجباري)</label><input id="reg-car" placeholder="كامري 2023"></div>
            <div class="field"><label>رقم اللوحة (إجباري)</label><input id="reg-plate" placeholder="أ ب ج 1234"></div>
            <button id="submitBtn" class="btn" onclick="submitRegistration()">✅ توثيق الرقم وإكمال التسجيل</button>
        </div>
    </div>

    <!-- الشاشة الرئيسية -->
    <div id="home" class="screen">
        <div style="text-align:center; margin-bottom:20px;"><h1 id="greeting" style="color:#f4d996;">أهلاً بك يا كابتن</h1></div>
        <div class="card" style="text-align:center;">
            <p id="status-text" style="color:#2ecc71; margin-bottom:10px;">✅ أنت متصل وجاهز للعمل</p>
            <button id="online-btn" class="btn" style="display:none;" onclick="toggleOnline()">🟢 بدء العمل</button>
            <button id="offline-btn" class="btn secondary" style="display:none;" onclick="stopWork()">🔴 إيقاف العمل</button>
        </div>
        <div class="grid">
            <div class="stat"><b id="stat-trips">0</b><span style="color:#a69b87;font-size:10px;">رحلات</span></div>
            <div class="stat"><b id="stat-rating">5.0</b><span style="color:#a69b87;font-size:10px;">تقييم</span></div>
            <div class="stat"><b id="stat-wallet">0</b><span style="color:#a69b87;font-size:10px;">رصيد</span></div>
            <div class="stat"><b id="stat-orders">0</b><span style="color:#a69b87;font-size:10px;">طلبات</span></div>
        </div>
        <h3 style="color:#f4d996; margin-top:20px; margin-bottom:10px; font-size:14px;">📥 الطلبات المتاحة</h3>
        <div id="orders">لا توجد طلبات حالياً.</div>
    </div>

    <!-- شاشة المزيد -->
    <div id="features" class="screen">
        <h1 style="color:#f4d996; text-align:center; margin-bottom:20px;">✨ المزيد</h1>
        <div class="card"><h3 style="color:#f4d996; margin-bottom:10px;">💰 المحفظة</h3><p id="wallet-info">جاري التحميل...</p></div>
        <div class="card"><h3 style="color:#f4d996; margin-bottom:10px;">👥 دعوة الأصدقاء</h3><p id="ref-info">جاري التحميل...</p></div>
        <button class="btn" onclick="toast('✅ تم تحديث الموقع بنجاح')">📍 تحديث موقعي</button>
    </div>
</div>

<div class="bottom-nav" id="bottom-nav" style="display:none;">
    <button class="nav active" onclick="go('home')">🏠 الرئيسية</button>
    <button class="nav" onclick="go('features')">✨ المزيد</button>
</div>

<div id="toast" class="toast"></div>

<script>
let tg = window.Telegram.WebApp;
try { tg.ready(); tg.expand(); } catch(e) {}

const API = "https://aneqnezary.site/driver-app/api";

function toast(msg ) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function go(id) {
    document.querySelectorAll('.screen').forEach(e => e.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.nav').forEach(e => e.classList.remove('active'));
    if(event && event.currentTarget) event.currentTarget.classList.add('active');
}

async function apiFetch(endpoint, opts={}) {
    const headers = new Headers(opts.headers || {});
    if(tg.initData) headers.set('X-Telegram-Init-Data', tg.initData);
    headers.set('Content-Type', 'application/json');
    return window.fetch(API + endpoint, { ...opts, headers });
}

async function submitRegistration() {
    const payload = {
        name: document.getElementById('reg-name').value.trim(),
        city: document.getElementById('reg-city').value,
        vehicle_type: document.getElementById('reg-vehicle').value,
        car_model: document.getElementById('reg-car').value.trim(),
        plate_number: document.getElementById('reg-plate').value.trim(),
        phone: 'بانتظار التوثيق',
        gender: document.getElementById('reg-gender').value,
        car_color: 'غير محدد'
    };

    if(!payload.name || !payload.car_model || !payload.plate_number) return toast('⚠️ أكمل جميع البيانات الإجبارية');

    const btn = document.getElementById('submitBtn');
    btn.textContent = '⏳ جاري الإرسال...';
    btn.disabled = true;

    try {
        const r = await apiFetch('/driver_register', { method: 'POST', body: JSON.stringify(payload) });
        if(!r.ok) throw new Error('فشل التسجيل');
        toast('✅ جاري نقلك للبوت لتوثيق الرقم...');
        setTimeout(() => { 
            window.open('https://t.me/Fast_driverbot?start=register', '_blank' );
            try { tg.close(); } catch(e){} 
        }, 1500);
    } catch(err) {
        toast('⚠️ حدث خطأ، يرجى المحاولة لاحقاً');
        btn.textContent = '✅ توثيق الرقم وإكمال التسجيل';
        btn.disabled = false;
    }
}

async function startApp() {
    let dId = tg.initDataUnsafe?.user?.id;
    
    // إذا لم يجد الآيدي، أرسله للتسجيل فوراً
    if(!dId) {
        document.getElementById('bottom-nav').style.display = 'none';
        go('register');
        return;
    }
    
    try {
        const r = await apiFetch('/driver_account/' + dId);
        const d = await r.json();
        
        if(!r.ok || !d.profile) {
            document.getElementById('bottom-nav').style.display = 'none';
            go('register');
        } else if(d.profile.driver_status === 'pending') {
            document.getElementById('bottom-nav').style.display = 'none';
            document.getElementById('loading').innerHTML = '<h2 style="color:#f4d996; margin-top:50px;">⏳ حسابك قيد المراجعة</h2><p style="color:#a69b87; margin-top:10px;">تم استلام بياناتك وبانتظار الإدارة.</p>';
        } else {
            // كابتن معتمد، أظهر له الرئيسية
            document.getElementById('bottom-nav').style.display = 'flex';
            go('home');
            document.getElementById('greeting').textContent = 'أهلاً يا ' + (d.profile.name || 'كابتن');
            document.getElementById('stat-trips').textContent = d.profile.trips_completed || 0;
            document.getElementById('stat-rating').textContent = Number(d.profile.rating || 5).toFixed(1);
            document.getElementById('stat-wallet').textContent = d.profile.balance || 0;
            document.getElementById('wallet-info').textContent = `الرصيد الحالي: ${d.profile.balance} ريال`;
            document.getElementById('ref-info').textContent = `عدد الدعوات: ${d.profile.referral_count || 0}`;
            
            const online = d.profile.is_online;
            document.getElementById('status-text').textContent = online ? '✅ أنت متصل وجاهز للعمل' : '💤 أنت غير متصل';
            document.getElementById('status-text').style.color = online ? '#2ecc71' : '#a69b87';
            document.getElementById('online-btn').style.display = online ? 'none' : 'block';
            document.getElementById('offline-btn').style.display = online ? 'block' : 'none';
        }
    } catch(e) {
        document.getElementById('bottom-nav').style.display = 'none';
        go('register'); 
    }
}

async function toggleOnline(){ await apiFetch('/driver_action', { method:'POST', body:JSON.stringify({action:'online'}) }); startApp(); toast('✅ أنت متصل الآن'); }
async function stopWork(){ await apiFetch('/driver_action', { method:'POST', body:JSON.stringify({action:'offline'}) }); startApp(); toast('💤 تم الإيقاف'); }

setTimeout(startApp, 200);
</script>
</body>
</html>
